<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Happy Birthday Soni ❤️</title><link rel="stylesheet" href="style.css"></head><body><div class="bg"></div><main><div class="title">HAPPY BIRTHDAY, <span>SONI</span> ♥</div><div class="hint" id="hint">Touch the cake and swipe to cut it ✨</div><div id="stage"><div class="glow"></div><div id="cake"><div class="tier top"><i></i><i></i><i></i><i></i><i></i></div><div class="tier mid"><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="tier bot"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="candle c1"></div><div class="candle c2"></div><div class="candle c3"></div><div class="flame f1"></div><div class="flame f2"></div><div class="flame f3"></div><div class="plate"></div></div><canvas id="cut"></canvas></div><button id="sound">♪</button></main><audio id="music" src="wishing.m4a" preload="auto"></audio><script>const c=document.querySelector('#cut'),x=c.getContext('2d'),cake=document.querySelector('#cake'),music=document.querySelector('#music'),hint=document.querySelector('#hint');let pts=[],down=false,done=false,started=false;function size(){let r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;x.setTransform(d,0,0,d,0,0)}addEventListener('resize',size);size();function P(e){let r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function draw(){x.clearRect(0,0,c.clientWidth,c.clientHeight);if(pts.length<2)return;x.lineCap='round';x.lineWidth=3;x.shadowBlur=18;x.shadowColor='#70d5ff';x.strokeStyle='#e8fbff';x.beginPath();pts.forEach((p,i)=>i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));x.stroke()}async function start(){if(started)return;started=true;music.volume=.85;try{await music.play()}catch(e){}}c.onpointerdown=e=>{if(done)return;e.preventDefault();down=true;pts=[P(e)];start();draw()};c.onpointermove=e=>{if(!down)return;e.preventDefault();let p=P(e),q=pts.at(-1);if(!q||Math.hypot(p.x-q.x,p.y-q.y)>3)pts.push(p);draw();if(pts.length>12&&Math.hypot(p.x-pts[0].x,p.y-pts[0].y)>Math.min(c.clientWidth*.35,250))finish()};c.onpointerup=()=>down=false;c.onpointercancel=()=>down=false;function finish(){if(done)return;done=true;cake.classList.add('cut');hint.textContent='Happy Birthday, Soni ❤️';setTimeout(()=>{hint.style.opacity='.55'},1200)}document.querySelector('#sound').onclick=async()=>{if(music.paused){try{await music.play()}catch(e){}document.querySelector('#sound').textContent='♪'}else{music.pause();document.querySelector('#sound').textContent='🔇'}};</script></body></html>
